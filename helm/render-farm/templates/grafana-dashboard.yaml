{{- if .Values.monitoring.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "render-farm.fullname" . }}-grafana-dashboard
  labels:
    {{- include "render-farm.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  render-farm-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 50},
                  {"color": "green", "value": 90}
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "title": "渲染进度",
          "type": "gauge",
          "targets": [
            {
              "expr": "sum(render_frames_total{status=\"success\",job_id=\"{{ .Values.global.jobId }}\"}) / {{ .Values.render.completions }} * 100",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 10,
                "gradientMode": "none",
                "lineInterpolation": "linear",
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "auto",
                "spanNulls": false
              },
              "unit": "s"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 6, "y": 0},
          "id": 2,
          "title": "单帧渲染耗时",
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(render_duration_seconds_bucket{job_id=\"{{ .Values.global.jobId }}\"}[5m])) by (le))",
              "legendFormat": "P50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(render_duration_seconds_bucket{job_id=\"{{ .Values.global.jobId }}\"}[5m])) by (le))",
              "legendFormat": "P95",
              "refId": "B"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 5}
                ]
              }
            }
          },
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "id": 3,
          "title": "Spot中断次数",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(increase(render_spot_interruptions_total{job_id=\"{{ .Values.global.jobId }}\"}[1h]))",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null}
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 4},
          "id": 4,
          "title": "活跃Pod数",
          "type": "stat",
          "targets": [
            {
              "expr": "count(up{job_id=\"{{ .Values.global.jobId }}\"} == 1)",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {
                "axisCenteredZero": false,
                "axisLabel": "",
                "axisPlacement": "auto",
                "drawStyle": "bars",
                "fillOpacity": 80,
                "gradientMode": "none",
                "lineWidth": 1,
                "pointSize": 5,
                "showPoints": "never"
              },
              "unit": "short"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 5,
          "title": "帧完成速率 (帧/分钟)",
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum(rate(render_frames_total{status=\"success\",job_id=\"{{ .Values.global.jobId }}\"}[5m])) * 60",
              "legendFormat": "完成速率",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "red", "value": 1}
                ]
              },
              "unit": "percentunit"
            }
          },
          "gridPos": {"h": 8, "w": 6, "x": 12, "y": 8},
          "id": 6,
          "title": "失败率",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(render_frames_total{status=\"failed\",job_id=\"{{ .Values.global.jobId }}\"}) / (sum(render_frames_total{job_id=\"{{ .Values.global.jobId }}\"}) + 0.001)",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null}
                ]
              },
              "unit": "currencyUSD"
            }
          },
          "gridPos": {"h": 8, "w": 6, "x": 18, "y": 8},
          "id": 7,
          "title": "预估成本",
          "type": "stat",
          "targets": [
            {
              "expr": "sum(render_estimated_cost_usd{job_id=\"{{ .Values.global.jobId }}\"})",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["render-farm", "blender"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "title": "Render Farm Monitor - {{ .Values.global.jobId }}",
      "uid": "render-farm-{{ .Values.global.jobId }}",
      "version": 1
    }
{{- end }}
