apiVersion: v1
kind: Secret
metadata:
  name: {{ include "render-farm.fullname" . }}-credentials
  labels:
    {{- include "render-farm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq .Values.global.cloudProvider "aliyun" }}
  # 阿里云凭证
  ALIBABA_CLOUD_ACCESS_KEY_ID: {{ .Values.aliyun.accessKeyId | quote }}
  ALIBABA_CLOUD_ACCESS_KEY_SECRET: {{ .Values.aliyun.accessKeySecret | quote }}
  {{- else }}
  # AWS凭证
  AWS_ACCESS_KEY_ID: {{ .Values.aws.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.aws.secretAccessKey | quote }}
  {{- end }}
